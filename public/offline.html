<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آفلاین — ShopAccounting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 3em; margin-bottom: 20px; }
    p { font-size: 1.2em; line-height: 1.6; margin-bottom: 30px; }
    button {
      background: #fff;
      color: #667eea;
      border: none;
      padding: 15px 40px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔌</h1>
    <h2>اتصال اینترنت برقرار نیست</h2>
    <p>برخی از امکانات با استفاده از داده‌های ذخیره‌شده محلی در دسترس هستند.</p>
    <button onclick="location.reload()">تلاش مجدد</button>
  </div>
</body>
</html>
