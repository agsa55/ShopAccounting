# ═══════════════════════════════════════════════════════════
# Nixpacks Configuration برای Railway
# ★ این فایل Railway را مجبور می‌کند Node.js 20 استفاده کند
# ★ و npm install به جای npm ci اجرا کند
# ═══════════════════════════════════════════════════════════

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "python3", "make", "g++"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "echo '🚀 Starting install with Node.js 20'",
  "node --version",
  "npm --version",
  "npm install --no-audit --no-fund --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "echo '🔨 Building project...'",
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npm run start:prod"