# ============================================================================
# Nginx Configuration for ShopAccounting
# 
# Features:
# - Reverse proxy to Next.js cluster (PM2)
# - Load balancing across multiple instances
# - SSL/TLS termination
# - Gzip compression
# - Static file caching
# - Rate limiting at Nginx level
# - WebSocket support for future real-time features
# - Security headers
# ============================================================================

# Upstream: PM2 cluster instances
upstream shopaccounting_app {
    # If running PM2 cluster on a single server
    server 127.0.0.1:3000;
    
    # If running multiple servers (horizontal scaling)
    # server 10.0.0.1:3000;
    # server 10.0.0.2:3000;
    # server 10.0.0.3:3000;
    
    # Load balancing method
    # least_conn;     # Route to instance with fewest active connections
    # ip_hash;        # Sticky sessions (same client → same instance)
    
    # Health check
    keepalive 64;    # Keep-alive connections to upstream
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" always;

# ============================================================================
# HTTP → HTTPS Redirect
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name shopaccounting.ir *.shopaccounting.ir;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# Main HTTPS Server
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shopaccounting.ir *.shopaccounting.ir;

    # ---- SSL Configuration ----
    ssl_certificate /etc/letsencrypt/live/shopaccounting.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopaccounting.ir/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ---- Logging ----
    access_log /var/log/nginx/shopaccounting-access.log;
    error_log /var/log/nginx/shopaccounting-error.log;

    # ---- Client body size ----
    client_max_body_size 10M;

    # ---- Next.js Static Files (served directly by Nginx) ----
    location /_next/static/ {
        proxy_pass http://shopaccounting_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # Next.js static files have content hash in filename - safe to cache aggressively
        expires 365d;
    }

    # ---- Public static files ----
    location /public/ {
        proxy_pass http://shopaccounting_app;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- PWA files ----
    location /sw.js {
        proxy_pass http://shopaccounting_app;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location /manifest.json {
        proxy_pass http://shopaccounting_app;
        add_header Cache-Control "public, max-age=604800";
    }

    location /icons/ {
        proxy_pass http://shopaccounting_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- Health check endpoint (no rate limiting) ----
    location /api/health {
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;  # Don't log health checks
    }

    # ---- Auth endpoints (strict rate limiting) ----
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- OTP endpoints (very strict rate limiting) ----
    location /api/otp/ {
        limit_req zone=auth_limit burst=2 nodelay;
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API endpoints (moderate rate limiting) ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket support (for future real-time features) ----
    location /ws/ {
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
    }

    # ---- Default proxy pass ----
    location / {
        proxy_pass http://shopaccounting_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Keep-alive to upstream
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
